name: Release

# Tag-driven releases (WHISPER-39): pushing a semantic-version tag IS the release. MinVer derives the
# version from the tag, the app is built + tested, packaged with Velopack, and the installer + update
# package + feed are published to a GitHub Release for that tag. A failing build or test fails the job
# before anything is published, so a broken build never ships.
on:
  push:
    tags: ["v*.*.*"]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    name: Build, Package & Publish
    # Windows is required: the WPF Presentation project targets net10.0-windows, and packaging is win-x64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs full history and tags to derive the version from the pushed tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Whisper.slnx

      - name: Build (warnings as errors)
        run: dotnet build Whisper.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (unit + Reqnroll specs)
        # A failing build or test fails the job here — before packaging and publishing — so a broken
        # build never produces a release. @wip scenarios are excluded from the gate.
        run: dotnet test Whisper.slnx --no-build --filter "Category!=wip"

      - name: Package installer (Velopack)
        # build/pack.ps1 derives the version from the pushed tag via MinVer and runs `vpk pack`, stamping
        # the same version into the assemblies and the Velopack package. Output lands in ./releases.
        shell: pwsh
        run: ./build/pack.ps1
        env:
          # Code-signing secrets are injected from GitHub Actions secrets and consumed by the packaging
          # step; they are never echoed to the log. The signing implementation lands in WHISPER-29; absent
          # secrets simply produce an unsigned build (no failure).
          VELOPACK_SIGN_CERTIFICATE: ${{ secrets.VELOPACK_SIGN_CERTIFICATE }}
          VELOPACK_SIGN_PASSWORD: ${{ secrets.VELOPACK_SIGN_PASSWORD }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The installer, the update package, and the release feed — the assets the in-app updater reads.
          files: |
            releases/*-Setup.exe
            releases/*-Portable.zip
            releases/*-full.nupkg
            releases/RELEASES
            releases/*.json
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
