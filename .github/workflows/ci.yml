name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: ["main"]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pr-title:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          scopes: |
            domain
            application
            logic
            infrastructure
            infra
            presentation
            ci
            docs
            tests
            hooks
            build
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter.
            Example: "feat(application): add continuous dictation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build, Test & Verify
    needs: [pr-title]
    # Windows is required: the WPF Presentation project targets net10.0-windows.
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Whisper.slnx

      - name: Build (warnings as errors)
        run: dotnet build Whisper.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Verify formatting
        run: dotnet format Whisper.slnx --no-restore --verify-no-changes

      - name: Test (unit + Reqnroll specs) with coverage
        # @wip scenarios are excluded from the gate; @slow real-model tests run in their own step below
        # to keep this gate fast and deterministic. Everything else must pass.
        run: >-
          dotnet test Whisper.slnx
          --no-build
          --filter "Category!=wip&Category!=slow"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Slow tests (real Silero VAD model)
        # Exercise the bundled silero_vad.onnx asset for real (load + ONNX inference) on every
        # PR. Kept separate from the gate above because it loads the ~1.8 MB model and runs inference.
        # @wip is excluded here too, so an in-progress slow test never breaks the gate.
        run: dotnet test Whisper.slnx --no-build --filter "Category=slow&Category!=wip"

      - name: Merge coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage-report
          reporttypes: Html;Cobertura;MarkdownSummaryGithub

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
          if-no-files-found: warn

      - name: Upload living documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-doc
          path: tests/Dictation.Specs/bin/**/TestResults/living-doc.html
          if-no-files-found: warn

      - name: Check for vulnerable packages
        shell: bash
        run: |
          OUTPUT=$(dotnet list Whisper.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected!"
            exit 1
          fi
